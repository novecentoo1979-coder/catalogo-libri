
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalogo libri — Antonio Gambardella</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f7f8fa;
      color: #243047;
      font-family: Arial, sans-serif;
      line-height: 1.5;
    }
    header {
      background: #173b56;
      color: white;
      text-align: center;
      padding: 38px 20px;
    }
    h1 { margin: 0 0 12px; }
    main {
      max-width: 700px;
      margin: auto;
      padding: 24px 16px;
    }
    article {
      background: white;
      border: 1px solid #e2e5ea;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
    }
    h2 { margin-top: 0; }
    .button {
      display: inline-block;
      background: #176b4c;
      color: white;
      text-decoration: none;
      padding: 13px 20px;
      border-radius: 10px;
      font-weight: bold;
    }
    .soon { color: #657187; font-weight: bold; }
    footer {
      text-align: center;
      padding: 20px;
      color: #657187;
    }
  </style>
</head>
<body>
  <header>
    <h1>I libri di Antonio Gambardella</h1>
    <p>AUTISMO — NESSUNO ME L'AVEVA SPIEGATO COSÌ!</p>
  </header>
  <main>
    <article>
      <h2>PERCHÉ FA COSÌ?</h2>
      <p>Il primo volume della collana.</p>
      <a class="button"
         href="https://amzn.eu/d/0dBLZRUW"
         target="_blank" rel="noopener">
        Scopri il libro su Amazon
      </a>
    </article>
    <article>
      <h2>OSSERVARE, DESCRIVERE, CAPIRE — ABC FACILE</h2>
      <p>Il prossimo volume della collana.</p>
      <p class="soon">Prossimamente</p>
    </article>
  </main>
  <footer>Antonio Gambardella — Catalogo libri</footer>
</body>
</html>
